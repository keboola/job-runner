; Maximum amount of memory a script may consume (128MB)
; http://php.net/memory-limit
memory_limit = -1

; Defines the default timezone used by the date functions
; http://php.net/date.timezone
date.timezone = UTC

; Upload progress tracking is not used. Keeping it off removes the session
; callback from the multipart parser, the code path named in the reports behind
; the PHP critical security release of 2026-10-21.
session.upload_progress.enabled = Off
